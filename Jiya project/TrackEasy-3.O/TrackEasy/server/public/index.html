<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <script>(function(){try{var v=localStorage.getItem("trackeasy_theme_version");if(v!=="v2"){localStorage.setItem("theme","light");localStorage.setItem("trackeasy_theme_version","v2");}var t=localStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackEasy — Login & Signup</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png">
</head>

<body>
    <div class="container">
        <header class="app-header" style="text-align:center;margin-bottom:1rem;">
            <div class="logo"
                style="font-size:2.5rem;font-weight:700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
                <img src="/logo.png" alt="Logo" style="height: 150px; width: 150px;">
                <span class="trackeasy-gradient-text">TrackEasy</span>
            </div>
        </header>
        <div class="forms-container">
            <!-- Login Form -->
            <div class="form-wrapper" id="loginForm">
                <h2>Welcome Back</h2>
                <p class="subtitle">Please login to your account</p>

                <form id="loginFormElement">
                    <div class="input-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your registered email" required>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('loginPassword')">
                                <svg id="loginPassword-eye-closed" class="eye-icon" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                </svg>
                                <svg id="loginPassword-eye-open" class="eye-icon hidden"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="error-message" id="loginError"></div>

                    <button type="submit" class="btn btn-primary">
                        <span>Login</span>
                        <div class="loader" id="loginLoader"></div>
                    </button>
                </form>

                <p class="toggle-text">
                    Don't have an account?
                    <a href="#" id="showSignup">Sign up here</a>
                </p>
            </div>

            <!-- Signup Form -->
            <div class="form-wrapper hidden" id="signupForm">
                <h2>Create Account</h2>
                <p class="subtitle">Join us today!</p>

                <form id="signupFormElement">
                    <div class="input-group">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" placeholder="Choose a username" required>
                    </div>

                    <div class="input-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="signupPhone">Phone Number</label>
                        <input type="tel" id="signupPhone" placeholder="Enter 10-digit mobile number" pattern="\d{10}" title="Please enter a 10-digit phone number" required>
                    </div>

                    <div class="input-group">
                        <label for="signupPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signupPassword"
                                placeholder="Create a password (min 6 characters)" required>
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('signupPassword')">
                                <svg id="signupPassword-eye-closed" class="eye-icon" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                </svg>
                                <svg id="signupPassword-eye-open" class="eye-icon hidden"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signupConfirmPassword" placeholder="Re-enter your password"
                                required>
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('signupConfirmPassword')">
                                <svg id="signupConfirmPassword-eye-closed" class="eye-icon"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                </svg>
                                <svg id="signupConfirmPassword-eye-open" class="eye-icon hidden"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signupRole">Role</label>
                        <select id="signupRole" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="customer">Customer</option>
                            <option value="vendor">Vendor</option>
                            <option value="manager">Manager</option>
                        </select>
                    </div>

                    <div class="error-message" id="signupError"></div>
                    <div class="success-message" id="signupSuccess"></div>

                    <button type="submit" class="btn btn-primary">
                        <span>Sign Up</span>
                        <div class="loader" id="signupLoader"></div>
                    </button>
                </form>

                <p class="toggle-text">
                    Already have an account?
                    <a href="#" id="showLogin">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/scripts/biometrics.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
