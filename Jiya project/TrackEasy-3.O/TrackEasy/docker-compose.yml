services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./fraud-service/ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/docs', timeout=3); sys.exit(0)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  fraud-service:
    build:
      context: .
      dockerfile: ./fraud-service/Dockerfile
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      MONGODB_URI: mongodb://mongo:27017/trackeasy
      ML_SERVICE_URL: http://ml-service:8000
      FRAUD_BLOCK_COOLDOWN_MS: "600000"   # auto-unblock after 10 min (set 0 or very high to disable)
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_started

  trackeasy:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/trackeasy
      FRAUD_SERVICE_URL: http://fraud-service:5002
      JWT_SECRET: devsecret_change_in_production
      STRIPE_SECRET_KEY: sk_test_placeholder_replace_for_real_payments
    depends_on:
      mongo:
        condition: service_healthy
      fraud-service:
        condition: service_started

volumes:
  mongo_data:
